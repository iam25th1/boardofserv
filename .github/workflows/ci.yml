name: gate

on:
  push:
    branches: [main]
  # pull_request, never pull_request_target: a fork's pull request runs
  # with a read-only token and no secrets (this workflow uses none).
  pull_request:

# The token can read the code and nothing else.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # A hung step (an apt mirror that never answers) fails instead of
    # holding the runner for six hours.
    timeout-minutes: 45
    # A real Postgres for the payments worker lock test: an advisory lock
    # belongs to a database session, and PGlite has only one.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: locktest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      # Actions pinned to full commit SHAs (the tag they were, in the comment).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run gate
        env:
          # Build-time only placeholders. No real secret is needed to gate, and
          # none is present in CI. The secret-leak test enforces that.
          NEXT_PUBLIC_PRIVY_APP_ID: ci-placeholder
          TEST_POSTGRES_URL: postgres://postgres:locktest@localhost:5432/postgres
      # Clicks in real browser engines (Chromium, and WebKit for Safari), on
      # a production build with a made-up Privy app and a session answered
      # by the tests themselves: no key, nothing leaves the runner. Not the
      # dev server: its compile on demand made first visits wait past the
      # tests' limits on a busy runner.
      - run: npx playwright install --with-deps chromium webkit
      - run: npx next build
        env:
          NEXT_PUBLIC_PRIVY_APP_ID: e2etestappid0000000000000
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run test:e2e
        env:
          E2E_PROD: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
