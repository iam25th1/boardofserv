name: gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    # A real Postgres for the payments worker lock test: an advisory lock
    # belongs to a database session, and PGlite has only one.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: locktest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run gate
        env:
          # Build-time only placeholders. No real secret is needed to gate, and
          # none is present in CI. The secret-leak test enforces that.
          NEXT_PUBLIC_PRIVY_APP_ID: ci-placeholder
          TEST_POSTGRES_URL: postgres://postgres:locktest@localhost:5432/postgres
      # Clicks in real browser engines (Chromium, and WebKit for Safari), on
      # the dev server with a made-up Privy app and a session answered by
      # the tests themselves: no key, nothing leaves the runner.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
