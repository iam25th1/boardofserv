# boardofserv's own Cloudflare tunnel: a template, with placeholders.
#
# Copy it outside the repository (this host keeps it at
# ~/.boardofserv/tunnel/config.yml), fill in <TUNNEL_ID> and <HOME>, and run
# one cloudflared process with it under a supervisor (Pier, here). Change
# this template and the live copy together, then restart that process.
#
# It is not ~/.cloudflared/config.yml: no other tunnel reads it, and this
# tunnel serves nothing else. It runs by id with its own credentials file,
# so it never reads a cert. Management calls (create, route dns, info) name
# the origin cert of the account that holds the zone with --origincert,
# never the default cert.pem.
tunnel: <TUNNEL_ID>
credentials-file: <HOME>/.boardofserv/tunnel/boardofserv-credentials.json

originRequest:
  connectTimeout: 30s
  noTLSVerify: false

ingress:
  # The production build (npm run start:prod) on this port. Never the dev server.
  - hostname: boardofserv.25th.dev
    service: http://127.0.0.1:7560
  - service: http_status:404
