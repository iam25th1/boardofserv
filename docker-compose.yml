services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: boardofserv
      POSTGRES_PASSWORD: boardofserv
      POSTGRES_DB: boardofserv
    ports:
      # 5433 on the host so a local system Postgres on 5432 is left alone.
      - "5433:5432"
    volumes:
      - boardofserv_pgdata:/var/lib/postgresql/data

volumes:
  boardofserv_pgdata:
