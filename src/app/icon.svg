<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- The tab icon: the boardofserv mark (the board with the wave on it, as
       in the header) in chalk on a slate tile, so it reads in light and dark
       tabs alike. Drawn for small sizes: the board's and the stand's lines
       fall on whole pixels at 16 and 32 pixels, the wave is a little
       heavier, and the stand sits two pixels clear of the board at 16.
       scripts/render-icons.mjs renders it to src/app/favicon.ico. -->
  <rect width="32" height="32" rx="7" fill="#1d201f" />
  <g fill="none" stroke="#e9eae4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="5" width="22" height="16" rx="3" />
    <path d="M9.5 13c2.17-5 4.33-5 6.5 0s4.33 5 6.5 0" stroke-width="3" />
    <path d="M11 27h10" />
  </g>
</svg>
